apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  labels: {app.kubernetes.io/name: temporal, app.kubernetes.io/part-of: gavel-mvp}
spec:
  selector: {app.kubernetes.io/name: temporal}
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels: {app.kubernetes.io/name: temporal, app.kubernetes.io/part-of: gavel-mvp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: temporal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temporal, app.kubernetes.io/part-of: gavel-mvp}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.1
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_SEEDS, value: postgresql}
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PWD
              valueFrom: {secretKeyRef: {name: gavel-platform-postgres, key: admin-password}}
            - {name: SKIP_DEFAULT_NAMESPACE_CREATION, value: "true"}
          ports:
            - {name: grpc, containerPort: 7233}
          readinessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
