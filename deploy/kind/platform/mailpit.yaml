apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: {app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: gavel-mvp}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http, nodePort: 30025}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: gavel-mvp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mailpit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: gavel-mvp}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.8
          imagePullPolicy: IfNotPresent
          env:
            - {name: MP_MAX_MESSAGES, value: "500"}
            - {name: MP_DATABASE, value: /data/mailpit.db}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /api/v1/info, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
