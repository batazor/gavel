apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels: {app.kubernetes.io/name: redpanda, app.kubernetes.io/part-of: gavel-mvp}
spec:
  selector: {app.kubernetes.io/name: redpanda}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
    - {name: admin, port: 9644, targetPort: admin}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels: {app.kubernetes.io/name: redpanda, app.kubernetes.io/part-of: gavel-mvp}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redpanda}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redpanda, app.kubernetes.io/part-of: gavel-mvp}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -ec]
          args:
            - >-
              export RP_BOOTSTRAP_USER="${REDPANDA_ADMIN_USER}:${REDPANDA_ADMIN_PASSWORD}";
              exec rpk redpanda start
              --mode dev-container --smp 1 --memory 768M --reserve-memory 0M --overprovisioned
              --kafka-addr internal://0.0.0.0:9092
              --advertise-kafka-addr internal://redpanda:9092
              --rpc-addr 0.0.0.0:33145
              --advertise-rpc-addr redpanda:33145
              --set redpanda.enable_sasl=true
              --set redpanda.auto_create_topics_enabled=false
          env:
            - {name: REDPANDA_ADMIN_USER, valueFrom: {secretKeyRef: {name: gavel-redpanda-admin, key: username}}}
            - {name: REDPANDA_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: gavel-redpanda-admin, key: password}}}
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: admin, containerPort: 9644}
          readinessProbe:
            httpGet: {path: /v1/status/ready, port: admin}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 150m, memory: 768Mi}
            limits: {cpu: "1", memory: 1280Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
