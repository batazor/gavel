apiVersion: v1
kind: Service
metadata:
  name: spicedb
  labels: {app.kubernetes.io/name: spicedb, app.kubernetes.io/part-of: gavel-mvp}
spec:
  selector: {app.kubernetes.io/name: spicedb}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
    - {name: metrics, port: 9090, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicedb
  labels: {app.kubernetes.io/name: spicedb, app.kubernetes.io/part-of: gavel-mvp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: spicedb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: spicedb, app.kubernetes.io/part-of: gavel-mvp}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-postgresql
          image: postgres:17.6-alpine
          command: [/bin/sh, -ec]
          args: ["until pg_isready --host=postgresql --port=5432; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: migrate
          image: authzed/spicedb:v1.46.2
          args: [migrate, head]
          env:
            - {name: SPICEDB_DATASTORE_ENGINE, value: postgres}
            - {name: SPICEDB_DATASTORE_CONN_URI, valueFrom: {secretKeyRef: {name: gavel-spicedb, key: datastore-uri}}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: spicedb
          image: authzed/spicedb:v1.46.2
          args: [serve, --grpc-addr=:50051, --http-enabled=false, --metrics-enabled=true, --metrics-addr=:9090]
          env:
            - {name: SPICEDB_DATASTORE_ENGINE, value: postgres}
            - {name: SPICEDB_DATASTORE_CONN_URI, valueFrom: {secretKeyRef: {name: gavel-spicedb, key: datastore-uri}}}
            - {name: SPICEDB_GRPC_PRESHARED_KEY, valueFrom: {secretKeyRef: {name: gavel-spicedb, key: preshared-key}}}
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: metrics, containerPort: 9090}
          readinessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 75m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
