apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: gavel-mvp}
spec:
  selector: {app.kubernetes.io/name: postgresql}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: gavel-mvp}
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: gavel-mvp}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: volume-permissions
          image: postgres:17.6-alpine
          command: [/bin/sh, -ec]
          args: ["mkdir -p /var/lib/postgresql/data/pgdata && chown -R 70:70 /var/lib/postgresql/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER]}
            runAsUser: 0
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      containers:
        - name: postgresql
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          args: [postgres, -c, wal_level=logical, -c, max_replication_slots=8, -c, max_wal_senders=8]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: gavel-platform-postgres, key: admin-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
