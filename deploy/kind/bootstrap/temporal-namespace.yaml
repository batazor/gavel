apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace-bootstrap
  labels: {app.kubernetes.io/name: temporal-namespace-bootstrap, app.kubernetes.io/part-of: gavel-mvp}
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: temporal-namespace-bootstrap, app.kubernetes.io/part-of: gavel-mvp}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
          command: [/bin/sh, -ec]
          args:
            - |
              until temporal operator cluster health --address temporal-frontend:7233 >/dev/null 2>&1; do sleep 2; done
              temporal operator namespace describe --address temporal-frontend:7233 gavel >/dev/null 2>&1 ||
                temporal operator namespace create --address temporal-frontend:7233 --retention 3d gavel
              ensure_search_attribute() {
                name="$1"
                type="$2"
                temporal operator search-attribute list --address temporal-frontend:7233 --namespace gavel |
                  grep -q "${name}" ||
                  temporal operator search-attribute create --address temporal-frontend:7233 \
                    --namespace gavel --name "${name}" --type "${type}"
              }
              ensure_search_attribute GavelProcessType Keyword
              ensure_search_attribute GavelLifecyclePhase Keyword
              ensure_search_attribute GavelCloseDeadlineMillis Int
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
