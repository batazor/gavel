# Экономный CI (ADR-0007).
# На каждый PR выполняется только дешёвое. Тяжёлые шаги обозначены, но выключены:
# `if: false` — чтобы pipeline читался целиком. Включать по мере надобности.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: likec4 validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run arch:validate

  rust-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false # включить, когда появится Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: tests (nextest + proptest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: false # дорого; гоняем локально перед PR
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace

  lean:
    name: lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: false # дорого; включить только для изменений в proofs/
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: false # включить, когда появятся чарты в deploy/charts
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: for c in deploy/charts/*; do helm lint "$c"; done

  images:
    name: build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: false # только по workflow_dispatch или тегу, когда дойдём до деплоя
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: echo "docker buildx build --push ... (stub)"
