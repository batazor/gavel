apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gavel.fullname" . }}
  labels:
    {{- include "gavel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gavel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "gavel.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "gavel.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "gavel.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HTTP_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.service.port | quote }}
            - name: GRPC_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.rpc.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.urlKey | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: AUTHZ_URL
              value: {{ .Values.authz.url | quote }}
            - name: AUTHZ_CALLER_SPIFFE_ID
              value: {{ .Values.authz.callerSpiffeId | quote }}
            - name: PROCESSES_SPIFFE_ID
              value: {{ required "runtime.processesSpiffeId is required" .Values.runtime.processesSpiffeId | quote }}
            - name: COMMAND_FINGERPRINT_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.commandFingerprint.existingSecret | quote }}
                  key: {{ .Values.commandFingerprint.key | quote }}
            - name: DEPENDENCY_TIMEOUT_MILLIS
              value: {{ .Values.runtime.dependencyTimeoutMillis | quote }}
            - name: REDPANDA_BROKERS
              value: {{ .Values.redpanda.brokers | quote }}
            - name: REDPANDA_GROUP_ID
              value: {{ .Values.redpanda.groupId | quote }}
            - name: REDPANDA_CLIENT_ID
              value: {{ .Values.redpanda.clientId | quote }}
            - name: REDPANDA_SECURITY_PROTOCOL
              value: {{ .Values.redpanda.securityProtocol | quote }}
            - name: REDPANDA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redpanda.sasl.secretRef.name | quote }}
                  key: {{ .Values.redpanda.sasl.secretRef.usernameKey | quote }}
            - name: REDPANDA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redpanda.sasl.secretRef.name | quote }}
                  key: {{ .Values.redpanda.sasl.secretRef.passwordKey | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.rpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.rpc.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
