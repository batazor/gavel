replicaCount: 1

image:
  repository: ghcr.io/batazor/gavel-auction
  tag: dev
  pullPolicy: IfNotPresent

service:
  port: 8080

rpc:
  enabled: true
  port: 9090
  allowedPrincipals:
    - cluster.local/ns/gavel/sa/gavel-processes
  allowedApplications:
    - gavel-processes

runtime:
  dependencyTimeoutMillis: 500
  processesSpiffeId: spiffe://cluster.local/ns/gavel/sa/gavel-processes

database:
  existingSecret: gavel-auction-database
  urlKey: url

redis:
  url: redis://gavel-redis:6379/

authz:
  url: http://gavel-authz:9090
  callerSpiffeId: spiffe://cluster.local/ns/gavel/sa/gavel-auction

commandFingerprint:
  existingSecret: gavel-auction-command-fingerprint
  key: key-hex

redpanda:
  brokers: redpanda.gavel-mvp.svc.cluster.local:9092
  groupId: gavel-auction-owner-events-v1
  clientId: gavel-auction
  securityProtocol: SASL_PLAINTEXT
  sasl:
    secretRef:
      name: gavel-redpanda-auction
      usernameKey: username
      passwordKey: password

migrations:
  enabled: true
  backoffLimit: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

monitoring:
  enabled: true
  scrapeInterval: 15s
