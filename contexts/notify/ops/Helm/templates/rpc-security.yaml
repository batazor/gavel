{{- if .Values.rpc.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "gavel.fullname" . }}-rpc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gavel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: [{{ .Values.service.port | quote }}]
    - from:
        - source:
            principals:
              {{- toYaml .Values.rpc.allowedPrincipals | nindent 14 }}
      to:
        - operation:
            ports: [{{ .Values.rpc.port | quote }}]
            paths: ["/gavel.notify.v1.NotifyService/SendNotification"]
    - from:
        - source:
            principals:
              {{- toYaml .Values.rpc.operatorPrincipals | nindent 14 }}
      to:
        - operation:
            ports: [{{ .Values.rpc.port | quote }}]
            paths: ["/gavel.notify.v1.NotifyOperatorService/GetNotification"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gavel.fullname" . }}-rpc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gavel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
    - from:
        {{- range .Values.rpc.allowedApplications }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.rpc.port }}
{{- end }}
