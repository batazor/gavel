replicaCount: 1

image:
  repository: ghcr.io/batazor/gavel-processes
  tag: dev
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

monitoring:
  enabled: true
  scrapeInterval: 15s

temporalMonitoring:
  enabled: true
  serviceSelector:
    app.kubernetes.io/part-of: temporal
  metricsPort: metrics
