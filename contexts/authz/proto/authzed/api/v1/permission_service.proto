// Derived from authzed/api at the revision documented in ../../UPSTREAM.md.
// Unused RPCs, fields and validation/HTTP annotations are intentionally omitted.
syntax = "proto3";

package authzed.api.v1;

import "authzed/api/v1/core.proto";

// PermissionsService is the official SpiceDB permissions API surface used by Gavel.
service PermissionsService {
  rpc WriteRelationships(WriteRelationshipsRequest) returns (WriteRelationshipsResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc CheckBulkPermissions(CheckBulkPermissionsRequest) returns (CheckBulkPermissionsResponse);
}

// Consistency selects the minimum authoritative revision for a read.
message Consistency {
  oneof requirement {
    bool minimize_latency = 1;
    ZedToken at_least_as_fresh = 2;
    ZedToken at_exact_snapshot = 3;
    bool fully_consistent = 4;
  }
}

// WriteRelationshipsRequest applies every update transactionally.
message WriteRelationshipsRequest {
  repeated RelationshipUpdate updates = 1;
}

// WriteRelationshipsResponse identifies the committed revision.
message WriteRelationshipsResponse {
  ZedToken written_at = 1;
}

// CheckPermissionRequest checks one subject/resource permission.
message CheckPermissionRequest {
  Consistency consistency = 1;
  ObjectReference resource = 2;
  string permission = 3;
  SubjectReference subject = 4;
}

// CheckPermissionResponse contains the authoritative decision.
message CheckPermissionResponse {
  enum Permissionship {
    PERMISSIONSHIP_UNSPECIFIED = 0;
    PERMISSIONSHIP_NO_PERMISSION = 1;
    PERMISSIONSHIP_HAS_PERMISSION = 2;
    PERMISSIONSHIP_CONDITIONAL_PERMISSION = 3;
  }

  ZedToken checked_at = 1;
  Permissionship permissionship = 2;
}

// CheckBulkPermissionsRequest checks an ordered list at one consistency requirement.
message CheckBulkPermissionsRequest {
  Consistency consistency = 1;
  repeated CheckBulkPermissionsRequestItem items = 2;
}

// CheckBulkPermissionsRequestItem contains one permission check.
message CheckBulkPermissionsRequestItem {
  ObjectReference resource = 1;
  string permission = 2;
  SubjectReference subject = 3;
}

// CheckBulkPermissionsResponse returns ordered pairs and a common revision.
message CheckBulkPermissionsResponse {
  ZedToken checked_at = 1;
  repeated CheckBulkPermissionsPair pairs = 2;
}

// CheckBulkPermissionsPair corresponds to one input item.
message CheckBulkPermissionsPair {
  CheckBulkPermissionsRequestItem request = 1;
  oneof response {
    CheckBulkPermissionsResponseItem item = 2;
  }
}

// CheckBulkPermissionsResponseItem contains one authoritative decision.
message CheckBulkPermissionsResponseItem {
  CheckPermissionResponse.Permissionship permissionship = 1;
}
