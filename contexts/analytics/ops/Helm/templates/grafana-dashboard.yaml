{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gavel.fullname" . }}-dashboard
  labels:
    {{- include "gavel.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Gavel/Analytics
data:
  analytics.json: |-
    {{- .Files.Get "files/grafana/dashboard.json" | nindent 4 }}
{{- end }}
