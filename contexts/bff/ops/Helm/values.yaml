replicaCount: 1

image:
  repository: ghcr.io/batazor/gavel-bff
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  nodePort: null

deploymentProfile: production

localAuth:
  enabled: false
  issuer: ""
  audience: ""
  jwksUri: ""
  catalogHttpEndpoint: ""
  corsOrigins: []
  routerPort: 8081
  envoy:
    image: envoyproxy/envoy:v1.35.3
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

monitoring:
  enabled: true
  scrapeInterval: 15s
