apiVersion: v1
kind: Service
metadata:
  name: {{ include "gavel-web.fullname" . }}
  labels:
    {{- include "gavel-web.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "gavel-web.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
